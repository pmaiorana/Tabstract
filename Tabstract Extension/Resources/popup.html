<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName">Tabstract</title>
  <script src="preload.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Split "Save Tabs" button with dropdown -->
  <div class="split-save" id="split-save">
    <button id="primaryButton" class="split-save-main" data-i18n="saveTabs">Save Tabs</button>
    <div class="split-save-divider"></div>
    <button id="save-more-btn" class="split-save-chevron" aria-label="More save options" aria-expanded="false">
      <svg width="10" height="6" viewBox="0 0 12 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1,1 6,6 11,1"/>
      </svg>
    </button>
  </div>
  <div id="save-dropdown" class="save-dropdown" style="display: none;">
    <button class="save-dropdown-item" data-scope="tab"><svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg><span data-i18n="saveThisTab">Save Tab</span></button>
    <button class="save-dropdown-item" data-scope="all"><svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="14" height="13" rx="2.5"/><path d="M7 8h14"/><path d="M17 19.5a2 2 0 0 1-2 1.5H5a2 2 0 0 1-2-2V8"/></svg><span data-i18n="saveAllTabs">Save All Tabs</span></button>
    <label class="save-dropdown-toggle">
      <input type="checkbox" id="closeAfterSaveToggle">
      <span id="closeAfterSaveLabel" data-i18n="saveAlsoClosesLabel">Close tabs when saving</span>
    </label>
  </div>
  <div id="save-dropdown-backdrop" class="save-dropdown-backdrop" style="display: none;"></div>

  <!-- Tab Selection Mode (hidden by default, shown on Option+Click) -->
  <div id="tabSelectionView" class="tab-selection-view" style="display: none;">
    <div class="tab-selection-header">
      <h2 data-i18n="selectTabsToSave">Select tabs to save</h2>
      <button id="globalToggleBtn" class="toggle-btn" data-state="all" data-i18n="selectNone">Select None</button>
    </div>
    <div id="tabSelectionList" class="tab-selection-list">
      <!-- Tabs will be dynamically inserted here -->
    </div>
    <div class="tab-selection-footer">
      <button id="cancelSelectionBtn" class="secondary-btn" data-i18n="cancel">Cancel</button>
      <button id="saveSelectedBtn" class="primary-btn" data-i18n="saveSelected">Save Selected</button>
    </div>
  </div>

  <!-- Bottom segmented row with 3 items -->
  <div class="bottom-row">
    <!-- Home -->
    <a href="#" id="homeTabLink" class="bottom-item" data-i18n-title="navHome">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <!-- path for "house" -->
        <path d="M8.82812 19.5312L14.4922 19.5312L14.4922 13.2227C14.4922 12.7734 14.1992 12.4805 13.75 12.4805L9.58008 12.4805C9.13086 12.4805 8.82812 12.7734 8.82812 13.2227ZM0.839844 10.4297C1.11328 10.4297 1.33789 10.2832 1.54297 10.1172L11.3184 1.9043C11.4258 1.81641 11.5527 1.76758 11.6602 1.76758C11.7773 1.76758 11.8945 1.81641 12.002 1.9043L21.7871 10.1172C21.9824 10.2832 22.207 10.4297 22.4805 10.4297C23.0078 10.4297 23.3203 10.0488 23.3203 9.64844C23.3203 9.42383 23.2324 9.18945 23.0078 9.01367L12.832 0.46875C12.4609 0.15625 12.0605 0 11.6602 0C11.2598 0 10.8594 0.15625 10.4883 0.46875L0.3125 9.01367C0.0976562 9.18945 0 9.42383 0 9.64844C0 10.0488 0.3125 10.4297 0.839844 10.4297ZM18.0176 5.24414L20.4688 7.31445L20.4688 2.91016C20.4688 2.48047 20.1953 2.20703 19.7656 2.20703L18.7207 2.20703C18.3008 2.20703 18.0176 2.48047 18.0176 2.91016ZM5.05859 20.5371L18.2715 20.5371C19.6582 20.5371 20.4688 19.7461 20.4688 18.3789L20.4688 7.55859L18.8965 6.49414L18.8965 17.9883C18.8965 18.623 18.5547 18.9648 17.9395 18.9648L5.39062 18.9648C4.76562 18.9648 4.42383 18.623 4.42383 17.9883L4.42383 6.50391L2.85156 7.55859L2.85156 18.3789C2.85156 19.7559 3.66211 20.5371 5.05859 20.5371Z" fill="currentColor"/>
      </svg>
      <span data-i18n="navHome">Home</span>
    </a>

    <!-- Select Tabs -->
    <a href="#" id="selectTabsLink" class="bottom-item" data-i18n-title="selectTabsToSave">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <!-- path for "checkmark.square" -->
        <path d="M3.65625 20.3438L16.3438 20.3438C18.7891 20.3438 20.0312 19.1016 20.0312 16.6562L20.0312 3.96875C20.0312 1.52344 18.7891 0.28125 16.3438 0.28125L3.65625 0.28125C1.21094 0.28125 0 1.52344 0 3.96875L0 16.6562C0 19.1016 1.21094 20.3438 3.65625 20.3438ZM3.67188 18.7812C2.20703 18.7812 1.5625 18.1367 1.5625 16.6719L1.5625 3.95312C1.5625 2.48828 2.20703 1.84375 3.67188 1.84375L16.3281 1.84375C17.793 1.84375 18.4688 2.48828 18.4688 3.95312L18.4688 16.6719C18.4688 18.1367 17.793 18.7812 16.3281 18.7812ZM9.08594 15.1562C9.39844 15.1562 9.66406 15.0156 9.89844 14.7188L15.5312 7.4375C15.6875 7.23438 15.7812 7.03125 15.7812 6.8125C15.7812 6.32812 15.4062 5.98438 14.9062 5.98438C14.6094 5.98438 14.3906 6.09375 14.1875 6.375L9.05469 13.0781L6.78125 10.4062C6.5625 10.1406 6.34375 10.0469 6.07812 10.0469C5.5625 10.0469 5.17188 10.4375 5.17188 10.9531C5.17188 11.1875 5.26562 11.4062 5.42188 11.5938L8.22656 14.7344C8.49219 15.0312 8.76562 15.1562 9.08594 15.1562Z" fill="currentColor"/>
      </svg>
      <span data-i18n="navSelect">Select</span>
    </a>

    <!-- Snooze -->
    <a href="#" id="snoozeLink" class="bottom-item" data-i18n-title="snoozeToolbarBadge">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <!-- path for "bell.badge.slash" -->
        <path d="M5.85213 8.45156C5.77278 9.00723 5.72604 9.64201 5.71292 10.3589C5.63479 12.2632 5.29299 13.523 4.59963 14.3042C4.08206 14.8706 3.50588 15.4468 3.3301 15.73L3.3301 15.8472L13.256 15.8472L14.7323 17.3218L14.2578 17.3218C14.1797 19.2066 12.7051 20.857 10.6446 20.857C8.57424 20.857 7.09963 19.2066 7.02151 17.3218L2.90042 17.3218C1.98245 17.3218 1.42581 16.8531 1.42581 16.1402C1.42581 15.1636 2.4219 14.2847 3.27151 13.4156C3.91604 12.7417 4.08206 11.355 4.16018 10.232C4.18101 9.05961 4.28797 8.01419 4.50155 7.10248ZM8.54495 17.3218C8.62307 18.6499 9.46292 19.48 10.6446 19.48C11.8164 19.48 12.666 18.6499 12.7344 17.3218ZM17.1289 10.232C17.1973 11.355 17.3731 12.7417 18.0176 13.4156C18.8672 14.2847 19.8535 15.1636 19.8535 16.1402C19.8535 16.4153 19.7721 16.654 19.618 16.8429L16.0911 13.318C15.7877 12.5784 15.6274 11.6071 15.5762 10.3589C15.5567 9.70461 15.5176 9.14797 15.459 8.63039C15.9375 8.64993 16.543 8.56204 17.0117 8.41555C17.0703 8.99172 17.1094 9.58743 17.1289 10.232ZM18.8281 4.00149C18.8281 5.85696 17.2949 7.38039 15.4492 7.38039C13.584 7.38039 12.0606 5.85696 12.0606 4.00149C12.0606 2.13625 13.584 0.612817 15.4492 0.612817C17.2949 0.612817 18.8281 2.13625 18.8281 4.00149ZM11.8555 0.954614C11.5528 1.32571 11.2989 1.74563 11.1231 2.19485C10.9766 2.13625 10.8203 2.11672 10.6446 2.11672C9.73635 2.11672 9.16018 2.82961 9.12112 3.84524C9.11135 4.09914 8.9844 4.21633 8.74026 4.27493C8.32447 4.38854 7.93381 4.55721 7.5804 4.81205L6.46956 3.70183C6.86016 3.39603 7.31009 3.15119 7.82229 2.96633C8.15432 1.68704 9.19924 0.681176 10.6446 0.681176C11.084 0.681176 11.5039 0.778832 11.8555 0.954614Z" fill="currentColor"/>
        <path d="M1.67971 2.6636L19.2188 20.1831C19.5117 20.4859 20 20.4859 20.2832 20.1831C20.5762 19.8902 20.5762 19.4214 20.2832 19.1187L2.75393 1.59914C2.46096 1.30618 1.98245 1.30618 1.67971 1.59914C1.39651 1.88235 1.39651 2.38039 1.67971 2.6636Z" fill="currentColor"/>
      </svg>
      <span>Snooze</span>
    </a>
  </div>

  <script src="popup.js"></script>
  <script src="accentColor.js"></script>
</body>
</html>
